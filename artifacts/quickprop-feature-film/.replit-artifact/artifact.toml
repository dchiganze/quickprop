kind = "video"
videoAspectRatio = "16:9"
previewPath = "/quickprop-feature-film/"
title = "QuickProp — 10 Second Feature Film"
description = "A 10-second 16:9 animated product film showcasing the QuickProp mobile agent experience, from managing property listings to creating and sharing branded property marketing."
version = "1.0.0"
id = "artifacts/quickprop-feature-film"
router = "path"

[[services]]
name = "web"
paths = [ "/quickprop-feature-film/" ]
localPort = 20409

[services.development]
run = "pnpm --filter @workspace/quickprop-feature-film run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/quickprop-feature-film", "run", "build" ]
serve = "static"
publicDir = "artifacts/quickprop-feature-film/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "20409"
BASE_PATH = "/quickprop-feature-film/"