        expiresAt: { type: string, format: date-time }
    PasskeyRegistrationVerificationInput:
      type: object
      required: [challengeId, credential]
      properties:
        challengeId: { type: string }
        credential: { type: object, additionalProperties: true }
    PasskeyAuthenticationVerificationInput:
      type: object
      required: [challengeId, credential]
      properties:
        challengeId: { type: string }
        credential: { type: object, additionalProperties: true }
    RentalAgency:
      type: object
      required: [id, name, verificationStatus, status, createdAt, updatedAt]
      properties:
        id: { type: integer }
        name: { type: string }
        tradingName: { type: ["string", "null"] }
        email: { type: ["string", "null"] }
        phone: { type: ["string", "null"] }
        website: { type: ["string", "null"] }
        address: { type: ["string", "null"] }
        verificationStatus: { type: string, enum: [pending, verified, rejected] }
        status: { type: string, enum: [active, inactive] }
        createdAt: { type: string }
        updatedAt: { type: string }
    RentalAgencyInput:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 2 }
        tradingName: { type: string }
        email: { type: string }
        phone: { type: string }
        website: { type: string }
        address: { type: string }
    RentalAgencyUpdate:
      type: object
      properties:
        name: { type: string, minLength: 2 }
        tradingName: { type: string }
        email: { type: string }
        phone: { type: string }
        website: { type: string }
        address: { type: string }
        verificationStatus: { type: string, enum: [pending, verified, rejected] }
        status: { type: string, enum: [active, inactive] }
    RentalHistoryInput:
      type: object
      required: [propertyAddress, suburb, city, startDate, endDate, tenancyType, refereeType]
      properties:
        propertyId: { type: ["integer", "null"] }
        propertyAddress: { type: string, minLength: 3 }
        suburb: { type: string, minLength: 2 }
        city: { type: string, minLength: 2 }
        startDate: { type: string, format: date }
        endDate: { type: string, format: date }
        tenancyType: { type: string, enum: [private_landlord, agency] }
        refereeType: { type: string, enum: [private_landlord, agency] }
        refereeName: { type: string }
        refereeEmail: { type: string }
        refereePhone: { type: string }
        agencyId: { type: ["integer", "null"] }
    ReferenceRequestInput:
      type: object
      required: [refereeType]
      properties:
        refereeType: { type: string, enum: [private_landlord, agency] }
        refereeName: { type: string }
        refereeEmail: { type: string }
        refereePhone: { type: string }
        agencyId: { type: ["integer", "null"] }
    RentalHistory:
      type: object
      required: [id, propertyId, propertyAddress, suburb, city, startDate, endDate, tenancyType, refereeType, refereeName, refereeEmail, refereePhone, agencyId, verificationStatus, verifiedAt, createdAt, updatedAt, reference, request, disputes]
      properties:
        id: { type: integer }
        propertyId: { type: ["integer", "null"] }
        propertyAddress: { type: string }
        suburb: { type: string }
        city: { type: string }
        startDate: { type: string }
        endDate: { type: string }
        tenancyType: { type: string }
        refereeType: { type: string }
        refereeName: { type: ["string", "null"] }
        refereeEmail: { type: ["string", "null"] }
        refereePhone: { type: ["string", "null"] }
        agencyId: { type: ["integer", "null"] }
        agency: { allOf: [{ $ref: "#/components/schemas/RentalAgency" }], nullable: true }
        verificationStatus: { type: string, enum: [verified, pending, self_reported, not_verified] }
        verifiedAt: { type: ["string", "null"] }
        createdAt: { type: string }
        updatedAt: { type: string }
        reference: { allOf: [{ $ref: "#/components/schemas/RentalReference" }], nullable: true }
        request: { allOf: [{ $ref: "#/components/schemas/ReferenceRequest" }], nullable: true }
