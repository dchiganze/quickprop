          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Lead" }
  /leads/{id}/timeline:
    get:
      operationId: getLeadTimeline
      tags: [leads]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        "200":
          description: Timeline entries
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/TimelineEntry" }
    post:
      operationId: addLeadTimelineEntry
      tags: [leads]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TimelineEntryInput" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TimelineEntry" }
  /tasks:
    get:
      operationId: listTasks
      tags: [tasks]
      parameters:
        - { name: status, in: query, schema: { type: string } }
        - { name: assigneeId, in: query, schema: { type: integer } }
      responses:
        "200":
          description: Tasks
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Task" }
    post:
      operationId: createTask
      tags: [tasks]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TaskInput" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Task" }
  /tasks/{id}:
    patch:
      operationId: updateTask
      tags: [tasks]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TaskUpdate" }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Task" }
    delete:
      operationId: deleteTask
      tags: [tasks]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        "204": { description: Deleted }
  /viewings:
    get:
      operationId: listViewings
      tags: [viewings]
      parameters:
        - { name: propertyId, in: query, schema: { type: integer } }
        - { name: agentId, in: query, schema: { type: integer } }
        - { name: date, in: query, schema: { type: string } }
      responses:
        "200":
          description: Viewings
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Viewing" }
    post:
      operationId: createViewing
      tags: [viewings]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ViewingInput" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Viewing" }
  /viewings/{id}:
    patch:
      operationId: updateViewing
      tags: [viewings]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ViewingUpdate" }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Viewing" }
    delete:
      operationId: deleteViewing
      tags: [viewings]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        "204": { description: Deleted }
  /documents:
    get:
      operationId: listDocuments
      tags: [documents]
      parameters:
        - { name: propertyId, in: query, schema: { type: integer } }
        - { name: category, in: query, schema: { type: string } }
        - { name: q, in: query, schema: { type: string } }
      responses:
        "200":
          description: Documents
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Document" }
    post:
      operationId: createDocument
      tags: [documents]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DocumentInput" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Document" }
  /documents/{id}:
    delete:
      operationId: deleteDocument
      tags: [documents]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        "204": { description: Deleted }
  /users:
    get:
      operationId: listUsers
      tags: [users]
      responses:
        "200":
          description: Users
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/User" }
    post:
      operationId: createUser
      tags: [users]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UserInput" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
  /users/{id}:
