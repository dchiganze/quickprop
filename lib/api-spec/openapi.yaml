                items: { $ref: "#/components/schemas/Seller" }
    post:
      operationId: createSeller
      tags: [sellers]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SellerInput" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Seller" }
  /sellers/{id}:
    get:
      operationId: getSeller
      tags: [sellers]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        "200":
          description: Seller
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Seller" }
        "404": { description: Not found }
    patch:
      operationId: updateSeller
      tags: [sellers]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SellerUpdate" }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Seller" }
  /buyers:
    get:
      operationId: listBuyers
      tags: [buyers]
