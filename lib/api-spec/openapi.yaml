components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status: { type: string }
      required: [status]
    LoginInput:
      type: object
      required: [email, password]
      properties:
        email: { type: string }
        password: { type: string }
    LoginResult:
      allOf:
        - $ref: "#/components/schemas/User"
        - type: object
          required: [accessToken]
          properties:
            accessToken:
              type: string
              description: Signed bearer token for native clients, valid for up to 30 days.
    AccountDeletionInput:
      type: object
      required: [confirmation, password]
      properties:
        confirmation:
          type: string
          description: Must exactly equal DELETE.
        password:
          type: string
          description: The signed-in user's current password.
    AccountDeletionResult:
      type: object
      required: [ok]
      properties:
        ok: { type: boolean }
    User:
      type: object
      required: [id, name, email, role, status]
      properties:
        id: { type: integer }
        name: { type: string }
        email: { type: string }
        phone: { type: ["string", "null"] }
        role: { type: string, description: "principal | admin | senior_agent | agent | receptionist | marketing | viewer" }
        branchId: { type: ["integer", "null"] }
        status: { type: string, description: "active | suspended | inactive" }
        avatarUrl: { type: ["string", "null"] }
    UserInput:
      type: object
      required: [name, email, role]
      properties:
        name: { type: string }
        email: { type: string }
        phone: { type: string }
        role: { type: string }
        branchId: { type: integer }
        password: { type: string }
    UserUpdate:
      type: object
      properties:
        name: { type: string }
        email: { type: string }
        phone: { type: string }
        role: { type: string }
        branchId: { type: ["integer", "null"] }
        status: { type: string }
    Branch:
      type: object
      required: [id, name]
      properties:
        id: { type: integer }
        name: { type: string }
        address: { type: ["string", "null"] }
        phone: { type: ["string", "null"] }
    BranchInput:
      type: object
      required: [name]
      properties:
        name: { type: string }
        address: { type: string }
        phone: { type: string }
    Property:
      type: object
      required: [id, reference, title, status, pipelineStage, listingType, propertyType, price, currency, suburb, city]
      properties:
        id: { type: integer }
        reference: { type: string }
        title: { type: string }
        description: { type: ["string", "null"] }
        propertyType: { type: string, description: "house | apartment | townhouse | stand | commercial | industrial | farm" }
        listingType: { type: string, description: "sale | rent" }
        status: { type: string, description: "draft | internal_only | public | under_offer | sold | rented | archived | withdrawn | coming_soon | private_listing" }
        pipelineStage: { type: string, description: "draft | awaiting_photos | ready | published | under_offer | sold | archived" }
        price: { type: number }
        currency: { type: string }
        suburb: { type: string }
        city: { type: string }
        address: { type: ["string", "null"] }
        bedrooms: { type: ["integer", "null"] }
        bathrooms: { type: ["integer", "null"] }
        parking: { type: ["integer", "null"] }
        landSize: { type: ["number", "null"], description: "square metres" }
        buildingSize: { type: ["number", "null"] }
        features:
          type: array
          items: { type: string }
        photos:
          type: array
          items: { type: string }
        videoUrl: { type: ["string", "null"] }
        coverImage: { type: ["string", "null"] }
        agentId: { type: ["integer", "null"] }
        branchId: { type: ["integer", "null"] }
        sellerId: { type: ["integer", "null"] }
        mandateType: { type: ["string", "null"], description: "open | sole | exclusive" }
        mandateStart: { type: ["string", "null"] }
        mandateExpiry: { type: ["string", "null"] }
        commissionPercent: { type: ["number", "null"] }
        privateNotes: { type: ["string", "null"] }
        views: { type: integer }
