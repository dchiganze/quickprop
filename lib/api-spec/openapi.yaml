      operationId: createBranch
      tags: [branches]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BranchInput" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Branch" }
  /notifications:
    get:
      operationId: listNotifications
      tags: [notifications]
      responses:
        "200":
          description: Notifications
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Notification" }
  /notifications/{id}/read:
    patch:
      operationId: markNotificationRead
      tags: [notifications]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        "200":
          description: Marked read
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Notification" }
  /audit-log:
    get:
      operationId: listAuditLog
      tags: [audit]
      parameters:
        - { name: entityType, in: query, schema: { type: string } }
        - { name: userId, in: query, schema: { type: integer } }
      responses:
        "200":
          description: Audit entries
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/AuditEntry" }
  /dashboard/summary:
    get:
      operationId: getDashboardSummary
      tags: [dashboard]
      responses:
        "200":
          description: Dashboard cards
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DashboardSummary" }
  /dashboard/command-centre:
    get:
      operationId: getCommandCentre
      tags: [dashboard]
      summary: Attention items for the inventory command centre
      responses:
        "200":
          description: Attention items
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/AttentionItem" }
  /dashboard/charts:
    get:
      operationId: getDashboardCharts
      tags: [dashboard]
      responses:
        "200":
          description: Chart data
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DashboardCharts" }
  /activity/recent:
    get:
      operationId: getRecentActivity
      tags: [dashboard]
      responses:
        "200":
          description: Recent activity across the agency
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ActivityEntry" }
  /analytics/summary:
    get:
      operationId: getAnalyticsSummary
      tags: [analytics]
      responses:
        "200":
          description: Analytics data
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AnalyticsSummary" }
  /search:
    get:
      operationId: officeSearch
      tags: [search]
      summary: Natural-language office-wide search
      parameters:
        - { name: q, in: query, required: true, schema: { type: string } }
      responses:
        "200":
          description: Search results
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SearchResults" }
  /public/properties:
    get:
      operationId: listPublicProperties
      tags: [public]
      summary: Public property listings (no auth required)
      parameters:
        - { name: listingType, in: query, schema: { type: string } }
        - { name: propertyType, in: query, schema: { type: string } }
        - { name: suburb, in: query, schema: { type: string } }
        - { name: city, in: query, schema: { type: string } }
        - { name: minPrice, in: query, schema: { type: number } }
        - { name: maxPrice, in: query, schema: { type: number } }
        - { name: minBeds, in: query, schema: { type: integer } }
        - { name: minBaths, in: query, schema: { type: integer } }
        - { name: q, in: query, schema: { type: string } }
        - { name: page, in: query, schema: { type: integer } }
        - { name: limit, in: query, schema: { type: integer } }
        - { name: sort, in: query, schema: { type: string } }
      responses:
        "200":
          description: Public property listings
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PublicPropertyList" }
  /public/properties/{id}:
    get:
      operationId: getPublicProperty
      tags: [public]
      summary: Public property detail (no auth required)
      parameters:
        - { name: id, in: path, required: true, schema: { type: string }, description: Numeric ID or listing reference (for example QP-0005). }
      responses:
        "200":
          description: Property detail with agent info
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PublicPropertyDetail" }
        "404": { description: Not found }
  /public/agents:
    get:
      operationId: listPublicAgents
      tags: [public]
      summary: List all active agents (no auth required)
      responses:
        "200":
          description: Agents
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/PublicAgent" }
  /public/agents/{id}:
    get:
      operationId: getPublicAgent
      tags: [public]
      summary: Agent public profile with listings
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        "200":
          description: Agent profile
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PublicAgentProfile" }
        "404": { description: Not found }
  /public/enquiries:
    post:
      operationId: submitEnquiry
      tags: [public]
      summary: Submit an enquiry (no auth required)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EnquiryInput" }
      responses:
        "201":
          description: Enquiry submitted
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EnquiryResult" }
  /public/auth/register:
    post:
      operationId: registerBuyer
      tags: [public]
      summary: Register a buyer account
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BuyerRegistration" }
      responses:
        "201":
          description: Registered
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PublicBuyer" }
        "409":
          description: Email already registered
  /public/auth/login:
    post:
      operationId: loginBuyer
      tags: [public]
      summary: Login as buyer
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LoginInput" }
      responses:
        "200":
          description: Logged in
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PublicBuyer" }
        "401":
          description: Invalid credentials
  /public/auth/logout:
    post:
      operationId: logoutBuyer
      tags: [public]
      responses:
        "200":
          description: Logged out
  /public/auth/me:
    get:
      operationId: getPublicMe
      tags: [public]
      summary: Get current buyer session
      responses:
        "200":
          description: Current buyer
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PublicBuyer" }
        "401":
          description: Not logged in
  /public/saved:
    get:
      operationId: listSavedProperties
      tags: [public]
      summary: List buyer's saved properties (buyer auth required)
      responses:
        "200":
          description: Saved properties
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/PublicProperty" }
        "401":
          description: Not logged in
  /public/saved/{propertyId}:
    post:
      operationId: saveProperty
      tags: [public]
      summary: Save a property (buyer auth required)
      parameters:
        - { name: propertyId, in: path, required: true, schema: { type: integer } }
      responses:
        "201":
          description: Saved
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SavedResult" }
    delete:
      operationId: unsaveProperty
      tags: [public]
      summary: Unsave a property (buyer auth required)
      parameters:
        - { name: propertyId, in: path, required: true, schema: { type: integer } }
      responses:
        "204":
          description: Unsaved
  /public/stats:
    get:
      operationId: getMarketplaceStats
      tags: [public]
