      operationId: getLeadTimeline
      tags: [leads]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        "200":
          description: Timeline entries
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/TimelineEntry" }
    post:
      operationId: addLeadTimelineEntry
      tags: [leads]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TimelineEntryInput" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TimelineEntry" }
  /tasks:
    get:
      operationId: listTasks
      tags: [tasks]
      parameters:
        - { name: status, in: query, schema: { type: string } }
        - { name: assigneeId, in: query, schema: { type: integer } }
      responses:
        "200":
          description: Tasks
          content:
            application/json:
              schema:
                type: array
