      type: object
      required: [phone, code]
      properties:
        phone: { type: string }
        code: { type: string, minLength: 4, maxLength: 10 }
    LoginResult:
      allOf:
        - $ref: "#/components/schemas/User"
        - type: object
          required: [accessToken]
          properties:
            accessToken:
              type: string
              description: Signed bearer token for native clients, valid for up to 30 days.
    PasswordResetRequestInput:
      type: object
      required: [email]
      properties:
        email: { type: string, pattern: '^[^@\s]+@[^\s@]+\.[^\s@]+$' }
    PasswordResetCompleteInput:
      type: object
      required: [token, newPassword]
      properties:
        token: { type: string, minLength: 32, maxLength: 128 }
        newPassword:
          type: string
          minLength: 10
          pattern: '^(?=.*[A-Za-z])(?=.*[0-9])(?=.*[^A-Za-z0-9\s]).{10,}$'
          description: At least 10 characters with a letter, number, and special character.
