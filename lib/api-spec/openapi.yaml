openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: QuickProp Office API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
  - name: auth
  - name: properties
  - name: sellers
  - name: buyers
  - name: buyerRequests
  - name: leads
  - name: tasks
  - name: viewings
  - name: documents
  - name: users
  - name: branches
  - name: notifications
  - name: audit
  - name: dashboard
  - name: analytics
  - name: search
  - name: marketing
  - name: public
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /auth/login:
    post:
      operationId: login
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginInput"
      responses:
        "200":
          description: Logged in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResult"
        "401":
          description: Invalid credentials
  /auth/logout:
    post:
      operationId: logout
      tags: [auth]
      responses:
        "200":
          description: Logged out
  /auth/me:
    get:
      operationId: getCurrentUser
      tags: [auth]
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          description: Not logged in
  /auth/account:
    delete:
      operationId: deleteCurrentUserAccount
      tags: [auth]
      summary: Permanently delete the signed-in user's account and dependent data
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AccountDeletionInput"
      responses:
        "200":
          description: Account permanently deleted and session invalidated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountDeletionResult"
        "400":
          description: Invalid deletion confirmation
        "401":
          description: Not logged in or password is incorrect
  /properties:
    get:
      operationId: listProperties
      tags: [properties]
      parameters:
        - { name: status, in: query, schema: { type: string } }
        - { name: pipelineStage, in: query, schema: { type: string } }
        - { name: listingType, in: query, schema: { type: string } }
        - { name: propertyType, in: query, schema: { type: string } }
        - { name: suburb, in: query, schema: { type: string } }
        - { name: agentId, in: query, schema: { type: integer } }
        - { name: q, in: query, schema: { type: string } }
        - { name: minPrice, in: query, schema: { type: number } }
        - { name: maxPrice, in: query, schema: { type: number } }
      responses:
        "200":
          description: Properties
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Property" }
    post:
      operationId: createProperty
      tags: [properties]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PropertyInput" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Property" }
  /properties/{id}:
    get:
      operationId: getProperty
      tags: [properties]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        "200":
          description: Property
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Property" }
        "404": { description: Not found }
    patch:
      operationId: updateProperty
      tags: [properties]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PropertyUpdate" }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Property" }
    delete:
      operationId: deleteProperty
      tags: [properties]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        "204": { description: Deleted }
  /properties/{id}/price-history:
    get:
      operationId: getPropertyPriceHistory
      tags: [properties]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        "200":
          description: Price history
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/PriceHistoryEntry" }
  /properties/{id}/activity:
    get:
      operationId: getPropertyActivity
      tags: [properties]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        "200":
          description: Activity timeline
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ActivityEntry" }
  /properties/{id}/share:
    post:
      operationId: shareProperty
      tags: [marketing]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ShareInput" }
      responses:
        "200":
          description: Share link
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ShareResult" }
  /properties/{id}/brochure:
    post:
      operationId: generateBrochure
      tags: [marketing]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        "200":
          description: Brochure generated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BrochureResult" }
  /pipeline:
    get:
      operationId: getPipeline
      tags: [properties]
      summary: Properties grouped by pipeline stage
      responses:
        "200":
          description: Pipeline board
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/PipelineColumn" }
  /sellers:
    get:
      operationId: listSellers
      tags: [sellers]
      parameters:
        - { name: q, in: query, schema: { type: string } }
      responses:
        "200":
          description: Sellers
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Seller" }
    post:
      operationId: createSeller
      tags: [sellers]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SellerInput" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Seller" }
  /sellers/{id}:
    get:
      operationId: getSeller
      tags: [sellers]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        "200":
          description: Seller
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Seller" }
        "404": { description: Not found }
    patch:
      operationId: updateSeller
      tags: [sellers]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SellerUpdate" }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Seller" }
  /buyers:
    get:
      operationId: listBuyers
      tags: [buyers]
      parameters:
        - { name: q, in: query, schema: { type: string } }
      responses:
        "200":
          description: Buyers
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Buyer" }
    post:
      operationId: createBuyer
      tags: [buyers]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BuyerInput" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Buyer" }
  /buyers/{id}:
    get:
      operationId: getBuyer
      tags: [buyers]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        "200":
          description: Buyer
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Buyer" }
        "404": { description: Not found }
    patch:
      operationId: updateBuyer
      tags: [buyers]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BuyerUpdate" }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Buyer" }
  /buyers/{id}/matches:
    get:
      operationId: getBuyerMatches
      tags: [buyers]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        "200":
          description: Matching properties
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/PropertyMatch" }
  /buyer-requests:
    get:
      operationId: listBuyerRequests
      tags: [buyerRequests]
      parameters:
        - { name: status, in: query, schema: { type: string } }
      responses:
        "200":
          description: Buyer requests
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/BuyerRequest" }
    post:
      operationId: createBuyerRequest
      tags: [buyerRequests]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BuyerRequestInput" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BuyerRequest" }
  /buyer-requests/{id}:
    patch:
      operationId: updateBuyerRequest
      tags: [buyerRequests]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BuyerRequestUpdate" }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BuyerRequest" }
  /buyer-requests/{id}/matches:
    get:
      operationId: getBuyerRequestMatches
      tags: [buyerRequests]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
