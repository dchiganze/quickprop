      required: [id, name, email, phone, role, status, branchId]
      properties:
        id: { type: integer }
        name: { type: string }
        email: { type: string }
        phone: { type: ["string", "null"] }
        role: { type: string }
        status: { type: string }
        branchId: { type: ["integer", "null"] }
    AdminAgencyCreateInput:
      type: object
      required: [name, defaultBranchAddress]
      properties:
        name: { type: string, minLength: 2, maxLength: 160 }
        defaultBranchAddress: { type: string, minLength: 2, maxLength: 500 }
        logoUrl: { type: ["string", "null"] }
        email: { type: ["string", "null"] }
        phone: { type: ["string", "null"] }
        website: { type: ["string", "null"] }
        aboutText: { type: string, maxLength: 2000 }
    AdminAgencyUpdateInput:
      type: object
      properties:
        name: { type: string, minLength: 2, maxLength: 160 }
        logoUrl: { type: ["string", "null"] }
        email: { type: ["string", "null"] }
        phone: { type: ["string", "null"] }
        website: { type: ["string", "null"] }
        aboutText: { type: string, maxLength: 2000 }
        status: { type: string, enum: [active, archived] }
    AdminAgencyBranchCreateInput:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 2, maxLength: 500 }
        address: { type: ["string", "null"] }
        phone: { type: ["string", "null"] }
        isMain: { type: boolean }
    AdminAgencyAgentCreateInput:
      type: object
      required: [branchId, name, email, phone]
      properties:
        branchId: { type: integer, minimum: 1 }
        name: { type: string, minLength: 2, maxLength: 160 }
        email: { type: string, pattern: '^[^@\s]+@[^\s@]+\.[^\s@]+$', maxLength: 254 }
        phone: { type: string, minLength: 8, maxLength: 40 }
    AdminAgencyAgentCreateResult:
      type: object
      required: [id, name, email, branchId, branchName, status, setupEmailSent]
      properties:
        id: { type: integer }
        name: { type: string }
        email: { type: string }
        branchId: { type: integer }
        branchName: { type: string }
        status: { type: string, enum: [invited] }
        setupEmailSent: { type: boolean }
    AdminAgentSetupResendResult:
      type: object
      required: [id, email, setupEmailSent]
      properties:
        id: { type: integer }
        email: { type: string }
        setupEmailSent: { type: boolean }
    AdminAgencyBranchUpdateInput:
      type: object
      properties:
        agencyId: { type: ["integer", "null"] }
        name: { type: string, minLength: 2, maxLength: 500 }
        address: { type: ["string", "null"] }
        phone: { type: ["string", "null"] }
        isMain: { type: boolean }
        status: { type: string, enum: [active, archived] }
    AdminBranchMembersInput:
      type: object
      required: [userIds]
      properties:
        userIds:
          type: array
          uniqueItems: true
          items: { type: integer }
    AdminMyBranchOption:
      type: object
      required: [id, name, agencyName]
      properties:
        id: { type: integer }
        name: { type: string }
        agencyName: { type: string }
    AdminMyBranch:
      type: object
      required: [currentBranchId, currentBranchName, branches]
      properties:
        currentBranchId: { type: ["integer", "null"] }
        currentBranchName: { type: ["string", "null"] }
        branches:
          type: array
          items: { $ref: "#/components/schemas/AdminMyBranchOption" }
    AdminMyBranchInput:
      type: object
      required: [branchId]
      properties:
        branchId: { type: integer, minimum: 1 }
    PropertyModerationInput:
      type: object
      required: [action]
      properties:
        action: { type: string, description: "approve | hide | flag | expire | restore" }
        reason: { type: string }
    ImportFileInput:
      type: object
      required: [fileName, fileType, sizeBytes, storagePath]
      properties:
        fileName: { type: string }
        fileType: { type: string }
        sizeBytes: { type: integer }
        storagePath: { type: string }
    CreateImportSessionInput:
      type: object
      required: [files]
      properties:
        defaultBranchId: { type: integer, minimum: 1 }
        files:
          type: array
          minItems: 1
          items: { $ref: "#/components/schemas/ImportFileInput" }
    ImportBranchOption:
      type: object
      required: [id, name, address, isMain]
      properties:
        id: { type: integer }
        name: { type: string }
        address: { type: ["string", "null"] }
        isMain: { type: boolean }
    ImportBranchOptions:
      type: object
      required: [currentBranchId, mainBranchId, branches]
      properties:
        currentBranchId: { type: integer }
        mainBranchId: { type: integer }
        branches:
          type: array
          minItems: 1
          items: { $ref: "#/components/schemas/ImportBranchOption" }
    ImportFile:
      type: object
      required: [id, fileName, fileType, sizeBytes, processingStatus, processingAttempt, extractedRecordCount, createdAt]
      properties:
        id: { type: integer }
        fileName: { type: string }
        fileType: { type: string }
        sizeBytes: { type: integer }
        processingStatus: { type: string }
        processingAttempt: { type: integer }
        processingStartedAt: { type: ["string", "null"] }
        extractedRecordCount: { type: integer }
        error: { type: ["string", "null"] }
        completedAt: { type: ["string", "null"] }
        createdAt: { type: string }
        updatedAt: { type: string }
    ImportRecord:
      type: object
      required: [id, sourceFileId, branchId, branchName, data, fieldConfidence, confidenceScore, reviewStatus, duplicateStatus, validationIssues, mandateStatus, agentMatchStatus, createdAt, updatedAt]
      properties:
        id: { type: integer }
        sourceFileId: { type: integer }
        branchId: { type: ["integer", "null"] }
        branchName: { type: ["string", "null"] }
        sourceFileName: { type: string }
        sourceLocation: { type: ["string", "null"] }
        rawData: {}
        data: {}
        fieldConfidence: { type: object, additionalProperties: { type: integer } }
        confidenceScore: { type: integer }
        reviewStatus: { type: string }
        duplicateStatus: { type: string }
        matchedPropertyId: { type: ["integer", "null"] }
        match:
          type: ["object", "null"]
          additionalProperties: true
        validationIssues: { type: array, items: { type: string } }
        mandateStatus: { type: string }
        agentMatchStatus: { type: string }
        agentId: { type: ["integer", "null"] }
        agentName: { type: ["string", "null"] }
        sourceMetadata: {}
        createdAt: { type: string }
        updatedAt: { type: string }
    ImportSession:
      type: object
      required: [id, reference, status, totalFiles, totalRecords, recordsReady, recordsNeedingReview, recordsDuplicate, recordsPublished, recordsFailed, currentStage, progress, processingAttempt, processingStartedAt, processingHeartbeatAt, completedAt, createdAt, updatedAt]
      properties:
        id: { type: integer }
        reference: { type: string }
        status: { type: string }
        totalFiles: { type: integer }
        totalRecords: { type: integer }
        recordsReady: { type: integer }
        recordsNeedingReview: { type: integer }
        recordsDuplicate: { type: integer }
        recordsPublished: { type: integer }
        recordsFailed: { type: integer }
        currentStage: { type: string }
        progress: { type: integer }
        lastError: { type: ["string", "null"] }
        processingAttempt: { type: integer }
        processingStartedAt: { type: ["string", "null"] }
        processingHeartbeatAt: { type: ["string", "null"] }
        completedAt: { type: ["string", "null"] }
        createdAt: { type: string }
        updatedAt: { type: string }
    ImportSessionDetail:
      allOf:
        - $ref: "#/components/schemas/ImportSession"
        - type: object
          required: [files, records, columnMapping]
          properties:
            files:
              type: array
              items: { $ref: "#/components/schemas/ImportFile" }
            records:
              type: array
              items: { $ref: "#/components/schemas/ImportRecord" }
            columnMapping: { type: object, additionalProperties: { type: string } }
    ProcessImportInput:
      type: object
      properties:
        columnMapping: { type: object, additionalProperties: { type: string } }
    UpdateImportRecordInput:
      type: object
      required: [data]
      properties:
        data: { type: object, additionalProperties: true }
        reviewStatus: { type: string }
        agentId: { type: ["integer", "null"] }
    BulkImportActionInput:
      type: object
      required: [recordIds, action]
      properties:
        recordIds: { type: array, items: { type: integer } }
        action: { type: string, description: "approve | reject | assign | mark_duplicate | link_duplicate | clear_duplicate" }
        agentId: { type: ["integer", "null"] }
    PublishImportInput:
      type: object
      required: [recordIds]
      properties:
        recordIds: { type: array, items: { type: integer } }
    PublishImportResult:
      type: object
      required: [published, linked, created, failed, errors]
      properties:
        published: { type: integer }
        linked: { type: integer }
        created: { type: integer }
        failed: { type: integer }
        errors: { type: array, items: { type: string } }
    ImportAssistantInput:
      type: object
      required: [sessionId, prompt]
      properties:
        sessionId: { type: integer }
        prompt: { type: string }
    ImportAssistantResponse:
      type: object
      required: [message, suggestions]
      properties:
        message: { type: string }
        suggestions: { type: array, items: { type: string } }
