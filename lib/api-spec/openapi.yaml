openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: QuickProp Office API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
  - name: auth
  - name: properties
  - name: sellers
  - name: buyers
  - name: buyerRequests
  - name: leads
  - name: tasks
  - name: viewings
  - name: documents
  - name: users
  - name: branches
  - name: notifications
  - name: audit
  - name: dashboard
  - name: analytics
  - name: search
  - name: marketing
  - name: public
  - name: collaboration
  - name: listing-housekeeping
  - name: reviews
  - name: property-alerts
paths:
  /agents/{id}/past-sales:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer } }
    get:
      operationId: getAgentPastSales
      tags: [users]
      responses:
        "200":
          description: Historical sales and completed QuickProp sales
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AgentSalesHistory" }
    post:
      operationId: createAgentPastSale
      tags: [users]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AgentPastSaleInput" }
      responses:
        "201":
          description: Historical sale added
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PublicSellingHistory" }
  /agents/{id}/past-sales/{saleId}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer } }
      - { name: saleId, in: path, required: true, schema: { type: integer } }
    put:
      operationId: updateAgentPastSale
      tags: [users]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AgentPastSaleInput" }
      responses:
        "200":
          description: Historical sale updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PublicSellingHistory" }
    delete:
      operationId: deleteAgentPastSale
      tags: [users]
      responses:
        "204":
          description: Historical sale removed
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /storage/media-url:
    get:
      operationId: getStoredMediaUrl
      tags: [storage]
      summary: Resolve a stored photo or video to a short-lived authorised URL
      parameters:
        - name: objectPath
          in: query
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Authorised media URL
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StoredMediaUrl" }
        "404": { description: Media not found or access denied }
  /auth/login:
    post:
      operationId: login
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginInput"
      responses:
        "200":
          description: Logged in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResult"
        "401":
          description: Invalid credentials
  /auth/phone/start:
    post:
      operationId: startPhoneLogin
      tags: [auth]
      summary: Send a Twilio Verify SMS code to an active QuickProp account phone
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PhoneLoginStartInput"
      responses:
        "202":
          description: Generic response that does not reveal whether a number is registered
        "400":
          description: Invalid phone number
        "503":
          description: Phone verification service unavailable
  /auth/phone/verify:
    post:
      operationId: verifyPhoneLogin
      tags: [auth]
      summary: Verify a Twilio code and issue a mobile session
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PhoneLoginVerifyInput"
      responses:
        "200":
          description: Verified phone and active QuickProp account
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResult"
        "400":
          description: Invalid request
        "401":
          description: Code is invalid or account is not eligible
        "503":
          description: Phone verification service unavailable
  /auth/passkeys/registration/options:
    post:
      operationId: getPasskeyRegistrationOptions
      tags: [auth]
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Native passkey creation challenge
          content:
            application/json:
              schema:
                type: object
                required: [challengeId, options]
                properties:
                  challengeId: { type: string }
                  options: { type: object, additionalProperties: true }
        "401":
          description: Authentication required
  /auth/passkeys/registration/verify:
    post:
      operationId: verifyPasskeyRegistration
      tags: [auth]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PasskeyRegistrationVerificationInput"
      responses:
        "200":
          description: Passkey was added to the account
        "400":
          description: Invalid or expired registration challenge
  /auth/passkeys/authentication/options:
    post:
      operationId: getPasskeyAuthenticationOptions
      tags: [auth]
      responses:
        "200":
          description: Native passkey authentication challenge
          content:
            application/json:
              schema:
                type: object
                required: [challengeId, options]
                properties:
                  challengeId: { type: string }
                  options: { type: object, additionalProperties: true }
  /auth/passkeys/authentication/verify:
    post:
      operationId: verifyPasskeyAuthentication
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PasskeyAuthenticationVerificationInput"
      responses:
        "200":
          description: Passkey verified and session issued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResult"
        "401":
          description: Passkey could not be verified
  /auth/password-reset/request:
    post:
      operationId: requestAdminPasswordReset
      tags: [auth]
      summary: Send a one-time admin password reset link when the account is eligible
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PasswordResetRequestInput"
      responses:
        "200":
          description: Generic result that does not reveal whether an account exists
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PasswordResetResult"
        "400":
          description: Invalid email address
        "503":
          description: Password reset email delivery is not configured
  /auth/password-reset/complete:
    post:
      operationId: completeAdminPasswordReset
      tags: [auth]
      summary: Set a new admin password using a valid one-time reset token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PasswordResetCompleteInput"
      responses:
        "200":
          description: Password changed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PasswordResetResult"
        "400":
          description: Invalid token or password details
        "410":
          description: Reset link expired or already used
  /auth/agent-setup/complete:
    post:
      operationId: completeAgentSetup
      tags: [auth]
      summary: Activate an invited agent account with a one-time setup token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AgentSetupCompleteInput"
      responses:
        "200":
          description: Agent password set and account activated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PasswordResetResult" }
        "400":
          description: Invalid token or password details
        "410":
          description: Setup link expired or already used
  /auth/logout:
    post:
      operationId: logout
      tags: [auth]
      responses:
        "200":
          description: Logged out
  /auth/me:
    get:
      operationId: getCurrentUser
      tags: [auth]
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          description: Not logged in
  /auth/profile:
    patch:
      operationId: updateCurrentUserProfile
      tags: [auth]
      summary: Update the signed-in user's personal profile details
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CurrentUserProfileUpdate"
      responses:
        "200":
          description: Updated current user profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          description: Invalid profile details
        "401":
          description: Not logged in
  /auth/account:
    delete:
      operationId: deleteCurrentUserAccount
      tags: [auth]
      summary: Permanently delete the signed-in user's account and dependent data
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AccountDeletionInput"
      responses:
        "200":
          description: Account permanently deleted and session invalidated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountDeletionResult"
        "400":
          description: Invalid deletion confirmation
        "401":
          description: Not logged in or password is incorrect
  /properties:
    get:
      operationId: listProperties
      tags: [properties]
      parameters:
        - { name: status, in: query, schema: { type: string } }
        - { name: pipelineStage, in: query, schema: { type: string } }
        - { name: listingType, in: query, schema: { type: string } }
        - { name: propertyType, in: query, schema: { type: string } }
        - { name: suburb, in: query, schema: { type: string } }
        - { name: agentId, in: query, schema: { type: integer } }
        - { name: q, in: query, description: 'Supports phrases such as "3 bedroom in Highlands under $300,000".', schema: { type: string } }
        - { name: minPrice, in: query, schema: { type: number } }
        - { name: maxPrice, in: query, schema: { type: number } }
      responses:
        "200":
          description: Properties
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Property" }
    post:
      operationId: createProperty
      tags: [properties]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PropertyInput" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Property" }
  /properties/{id}:
    get:
      operationId: getProperty
      tags: [properties]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        "200":
          description: Property
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Property" }
        "404": { description: Not found }
    patch:
      operationId: updateProperty
      tags: [properties]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PropertyUpdate" }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Property" }
    delete:
      operationId: deleteProperty
      tags: [properties]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        "204": { description: Deleted }
  /properties/{id}/mark-sold:
    post:
      operationId: markPropertySold
      tags: [properties]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MarkPropertySoldInput" }
      responses:
        "200":
          description: Property marked as sold
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Property" }
        "400": { description: Sale price is missing or invalid }
        "404": { description: Not found }
  /properties/{id}/price-history:
    get:
      operationId: getPropertyPriceHistory
      tags: [properties]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        "200":
          description: Price history
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/PriceHistoryEntry" }
  /properties/{id}/activity:
    get:
      operationId: getPropertyActivity
      tags: [properties]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        "200":
          description: Activity timeline
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ActivityEntry" }
  /properties/{id}/share:
    post:
      operationId: shareProperty
      tags: [marketing]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ShareInput" }
      responses:
        "200":
          description: Share link
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ShareResult" }
  /properties/{id}/brochure:
    post:
      operationId: generateBrochure
      tags: [marketing]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        "200":
          description: Brochure generated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BrochureResult" }
  /collaboration/discovery:
    get:
      operationId: listCollaborationDiscovery
      tags: [collaboration]
      summary: Published branch and opted-in cross-branch listings available for collaboration
      parameters:
        - { name: q, in: query, schema: { type: string } }
        - { name: suburb, in: query, schema: { type: string } }
        - { name: road, in: query, schema: { type: string } }
        - { name: description, in: query, schema: { type: string } }
        - { name: feature, in: query, schema: { type: string }, description: Comma-separated amenities or features. }
        - { name: minBedrooms, in: query, schema: { type: integer } }
        - { name: minPrice, in: query, schema: { type: number } }
        - { name: maxPrice, in: query, schema: { type: number } }
        - { name: minSize, in: query, schema: { type: number } }
        - { name: maxSize, in: query, schema: { type: number } }
      responses:
        "200":
          description: Available collaboration listings
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Property" }
  /collaboration/requests:
    get:
      operationId: listCollaborationRequests
      tags: [collaboration]
      parameters:
        - { name: direction, in: query, schema: { type: string, enum: [incoming, outgoing] } }
        - { name: status, in: query, schema: { type: string, enum: [pending, approved, declined, cancelled] } }
      responses:
        "200":
          description: Collaboration requests sent by or received by the signed-in user
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/CollaborationMatchRequest" }
    post:
      operationId: createCollaborationRequest
      tags: [collaboration]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CollaborationRequestInput" }
      responses:
        "201":
          description: Request created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CollaborationMatchRequest" }
  /collaboration/requests/{id}:
    patch:
      operationId: updateCollaborationRequest
      tags: [collaboration]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CollaborationRequestStatusUpdate" }
      responses:
        "200":
          description: Request status updated by the property owner
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CollaborationMatchRequest" }
  /pipeline:
    get:
      operationId: getPipeline
      tags: [properties]
      summary: Properties grouped by pipeline stage
      responses:
        "200":
          description: Pipeline board
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/PipelineColumn" }
  /sellers:
    get:
      operationId: listSellers
      tags: [sellers]
      parameters:
        - { name: q, in: query, schema: { type: string } }
      responses:
        "200":
          description: Sellers
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Seller" }
    post:
      operationId: createSeller
      tags: [sellers]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SellerInput" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Seller" }
  /agent-contacts:
    get:
      operationId: getAgentContacts
      tags: [sellers]
      parameters:
        - name: type
          in: query
          required: true
          schema: { type: string, enum: [seller, landlord] }
      responses:
        "200":
          description: Seller or landlord contacts linked to the signed-in user's property records
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/AgentContact" }
    post:
      operationId: createAgentContact
      tags: [sellers]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AgentContactCreateInput" }
      responses:
        "201":
          description: Standalone seller or landlord contact
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AgentContact" }
  /agent-contacts/{propertyId}/mandates:
    parameters:
      - { name: propertyId, in: path, required: true, schema: { type: integer } }
    post:
      operationId: createAgentContactMandate
      tags: [sellers]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AgentContactMandateInput" }
      responses:
        "201":
          description: Mandate document stored against the property
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Document" }
        "404": { description: Property not found or not accessible }
  /agent-contacts/{propertyId}/review-invitation:
    parameters:
      - { name: propertyId, in: path, required: true, schema: { type: integer } }
    post:
      operationId: createAgentContactReviewInvitation
      tags: [reviews]
      responses:
        "200":
          description: Shareable public review link for a completed mandate
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AgentContactReviewInvitation" }
        "400": { description: Review is only available after the mandate closes }
        "404": { description: Property not found or not accessible }
  /sellers/{id}:
    get:
      operationId: getSeller
      tags: [sellers]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        "200":
          description: Seller
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Seller" }
        "404": { description: Not found }
    patch:
      operationId: updateSeller
      tags: [sellers]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SellerUpdate" }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Seller" }
  /buyers:
    get:
      operationId: listBuyers
      tags: [buyers]
      parameters:
        - { name: q, in: query, schema: { type: string } }
      responses:
        "200":
          description: Buyers
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Buyer" }
    post:
      operationId: createBuyer
      tags: [buyers]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BuyerInput" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Buyer" }
  /buyers/{id}:
    get:
      operationId: getBuyer
      tags: [buyers]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        "200":
          description: Buyer
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Buyer" }
        "404": { description: Not found }
    patch:
      operationId: updateBuyer
      tags: [buyers]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BuyerUpdate" }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Buyer" }
  /buyers/{id}/matches:
    get:
      operationId: getBuyerMatches
      tags: [buyers]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        "200":
          description: Matching properties
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/PropertyMatch" }
  /buyer-requests:
    get:
      operationId: listBuyerRequests
      tags: [buyerRequests]
      parameters:
        - { name: status, in: query, schema: { type: string } }
      responses:
        "200":
          description: Buyer requests
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/BuyerRequest" }
    post:
      operationId: createBuyerRequest
      tags: [buyerRequests]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BuyerRequestInput" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BuyerRequest" }
  /buyer-requests/{id}:
    patch:
      operationId: updateBuyerRequest
      tags: [buyerRequests]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BuyerRequestUpdate" }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BuyerRequest" }
  /buyer-requests/{id}/matches:
    get:
      operationId: getBuyerRequestMatches
      tags: [buyerRequests]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        "200":
          description: Matching properties
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/PropertyMatch" }
  /leads:
    get:
      operationId: listLeads
      tags: [leads]
      parameters:
        - { name: stage, in: query, schema: { type: string } }
        - { name: agentId, in: query, schema: { type: integer } }
      responses:
        "200":
          description: Leads
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Lead" }
    post:
      operationId: createLead
      tags: [leads]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LeadInput" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Lead" }
  /leads/{id}:
    get:
      operationId: getLead
      tags: [leads]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        "200":
          description: Lead
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Lead" }
        "404": { description: Not found }
    patch:
      operationId: updateLead
