          application/json:
            schema: { $ref: "#/components/schemas/BuyerRequestInput" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BuyerRequest" }
  /buyer-requests/{id}:
    patch:
      operationId: updateBuyerRequest
      tags: [buyerRequests]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BuyerRequestUpdate" }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BuyerRequest" }
  /buyer-requests/{id}/matches:
    get:
      operationId: getBuyerRequestMatches
      tags: [buyerRequests]
