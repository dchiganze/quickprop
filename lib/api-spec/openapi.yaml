        - { name: recordId, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateImportRecordInput" }
      responses:
        "200":
          description: Updated import record
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ImportRecord" }
        "409": { description: Branch assignment required }
  /imports/sessions/{id}/bulk-action:
    post:
      operationId: bulkImportAction
      tags: [office-imports]
      summary: Apply a review action to selected import records
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BulkImportActionInput" }
      responses:
        "200":
          description: Updated session
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ImportSessionDetail" }
        "409": { description: Branch assignment required }
  /imports/sessions/{id}/publish:
    post:
      operationId: publishImportSession
      tags: [office-imports]
      summary: Validate and publish approved import records
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PublishImportInput" }
      responses:
        "200":
          description: Publish result
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PublishImportResult" }
        "409": { description: Branch assignment required }
  /imports/sessions/{id}/error-report:
    get:
      operationId: getImportErrorReport
      tags: [office-imports]
      summary: Download import validation errors
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        "200":
          description: CSV error report
          content:
            text/csv:
              schema: { type: string }
        "409": { description: Branch assignment required }
  /imports/assistant:
    post:
      operationId: askImportAssistant
      tags: [office-imports]
      summary: Ask the import assistant about corrections or mappings
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ImportAssistantInput" }
      responses:
        "200":
          description: Assistant guidance
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ImportAssistantResponse" }
        "409": { description: Branch assignment required }
components:
  schemas:
    StoredMediaUrl:
