name: Release validation

on:
  workflow_call:
  workflow_dispatch:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

jobs:
  api-import-regressions:
    name: API import regressions (PostgreSQL ${{ matrix.postgres-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        postgres-version: ["15", "16", "17"]
    services:
      postgres:
        image: postgres:${{ matrix.postgres-version }}
        env:
          POSTGRES_DB: quickprop_test
          POSTGRES_USER: quickprop_test
          POSTGRES_PASSWORD: quickprop_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U quickprop_test -d quickprop_test"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=12
    env:
      TEST_DATABASE_URL: postgresql://quickprop_test:quickprop_test@localhost:5432/quickprop_test
      PRIVATE_OBJECT_DIR: /quickprop-release-test
      AI_INTEGRATIONS_GEMINI_BASE_URL: http://127.0.0.1:1106
      AI_INTEGRATIONS_GEMINI_API_KEY: quickprop-release-test-key
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.26.1

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Create schema in isolated test database
        env:
          DATABASE_URL: ${{ env.TEST_DATABASE_URL }}
        run: pnpm --filter @workspace/db run push-force

      - name: Run database-backed import regressions
        run: pnpm --filter @workspace/api-server run test:release
