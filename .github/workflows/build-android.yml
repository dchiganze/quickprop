name: Build Android AAB

on:
  workflow_dispatch:

jobs:
  validate:
    name: Release validation
    uses: ./.github/workflows/release-validation.yml

  build:
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile --shamefully-hoist

      - name: Bump versionCode in app.json
        run: |
          node -e "
          const fs = require('fs');
          const path = 'artifacts/mobile/app.json';
          const app = JSON.parse(fs.readFileSync(path, 'utf8'));
          const current = app.expo.android.versionCode || 1;
          const next = current + 1;
          app.expo.android.versionCode = next;
          fs.writeFileSync(path, JSON.stringify(app, null, 2) + '\n');
          console.log('android.versionCode bumped: ' + current + ' -> ' + next);
          "

      - name: Install runtime deps pnpm missed into mobile node_modules
        run: |
          TMPDIR=$(mktemp -d)
          echo '{}' > "$TMPDIR/package.json"
          npm install --prefix "$TMPDIR" --no-save --no-package-lock --legacy-peer-deps \
            expo-secure-store@15.0.8 \
            expo-local-authentication@17.0.8 \
            expo-apple-authentication@8.0.8
          mkdir -p artifacts/mobile/node_modules
          rm -rf artifacts/mobile/node_modules/expo-secure-store \
                 artifacts/mobile/node_modules/expo-local-authentication \
                 artifacts/mobile/node_modules/expo-apple-authentication
          cp -r "$TMPDIR/node_modules/expo-secure-store"        artifacts/mobile/node_modules/
          cp -r "$TMPDIR/node_modules/expo-local-authentication" artifacts/mobile/node_modules/
          cp -r "$TMPDIR/node_modules/expo-apple-authentication" artifacts/mobile/node_modules/

      - name: Link mobile dependencies into artifacts/mobile/node_modules
        run: node .github/scripts/link-mobile-deps.js

      - name: Expo prebuild (Android)
        working-directory: artifacts/mobile
        run: npx expo prebuild --platform android --no-install

      - name: Create expo-secure-store res/xml files (library resources missing from cp install)
        run: |
          mkdir -p artifacts/mobile/android/app/src/main/res/xml
          cat > artifacts/mobile/android/app/src/main/res/xml/secure_store_backup_rules.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <!--  Auto Backup configuration for Android 11 and lower -->
          <full-backup-content>
            <include domain="sharedpref" path="."/>
            <exclude domain="sharedpref" path="SecureStore"/>
          </full-backup-content>
          EOF
          cat > artifacts/mobile/android/app/src/main/res/xml/secure_store_data_extraction_rules.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <!--  Auto Backup configuration for Android 12 and higher -->
          <data-extraction-rules>
            <cloud-backup>
              <include domain="sharedpref" path="."/>
              <exclude domain="sharedpref" path="SecureStore"/>
            </cloud-backup>
            <device-transfer>
              <include domain="sharedpref" path="."/>
              <exclude domain="sharedpref" path="SecureStore"/>
            </device-transfer>
          </data-extraction-rules>
          EOF

      - name: Decode keystore
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 --decode > artifacts/mobile/android-keystore.jks

      - name: Build Android AAB with Gradle
        working-directory: artifacts/mobile/android
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
        run: |
          chmod +x gradlew
          ./gradlew bundleRelease \
            -Pandroid.injected.signing.store.file="$(pwd)/../android-keystore.jks" \
            -Pandroid.injected.signing.store.password="${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" \
            -Pandroid.injected.signing.key.alias="${{ secrets.ANDROID_KEY_ALIAS }}" \
            -Pandroid.injected.signing.key.password="${{ secrets.ANDROID_KEY_PASSWORD }}"

      - name: Locate AAB
        id: aab
        run: |
          set -euo pipefail
          AAB="artifacts/mobile/android/app/build/outputs/bundle/release/app-release.aab"
          if [ ! -f "$AAB" ]; then
            echo "Expected final release bundle at $AAB, but it was not created."
            find artifacts/mobile/android -type f -name "*.aab" -print
            exit 1
          fi
          if ! jarsigner -verify "$AAB" >/tmp/jarsigner-verify.log 2>&1; then
            cat /tmp/jarsigner-verify.log
            echo "The final release bundle is not signed."
            exit 1
          fi
          echo "path=$AAB" >> "$GITHUB_OUTPUT"
          echo "Found signed AAB: $AAB"

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: quickprop-agent-android
          path: ${{ steps.aab.outputs.path }}
          retention-days: 7

      - name: Build debug APK for Test Lab
        run: |
          cd artifacts/mobile/android
          export ANDROID_HOME=/usr/local/lib/android/sdk
          ./gradlew assembleDebug

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: quickprop-agent-debug
          path: artifacts/mobile/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7

            # ── Firebase Test Lab (Robo) ─────────────────────────────────────────
      # Disabled: the service account needs roles/firebase.qaAdmin granted
      # in the GCP console before it can write to the test-lab-* bucket.
      # Re-enable these steps after granting that role to WIF_SERVICE_ACCOUNT:
      #
      #   gcloud projects add-iam-policy-binding quickprop-c365c \
      #     --member="serviceAccount:<WIF_SERVICE_ACCOUNT>" \
      #     --role="roles/firebase.qaAdmin"
      # ─────────────────────────────────────────────────────────────────────

  submit:
    name: Submit AAB to Google Play internal testing
    needs: build
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    steps:
      - name: Download release AAB
        uses: actions/download-artifact@v4
        with:
          name: quickprop-agent-android
          path: android-artifact

      - name: Verify downloaded bundle
        id: aab
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t bundles < <(find android-artifact -type f -name '*.aab' -print)
          if [ "${#bundles[@]}" -ne 1 ]; then
            echo "Expected exactly one Android App Bundle, found ${#bundles[@]}."
            printf '%s\n' "${bundles[@]}"
            exit 1
          fi
          echo "path=${bundles[0]}" >> "$GITHUB_OUTPUT"
          echo "Using ${bundles[0]}"

      - name: Upload release to Google Play
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: zw.co.melios.quickprop.agent
          releaseFiles: ${{ steps.aab.outputs.path }}
          tracks: internal
          status: completed
