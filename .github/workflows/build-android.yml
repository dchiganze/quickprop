name: Build Android AAB

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile --shamefully-hoist

      - name: Bump versionCode in app.json
        run: |
          node -e "
          const fs = require('fs');
          const path = 'artifacts/mobile/app.json';
          const app = JSON.parse(fs.readFileSync(path, 'utf8'));
          const current = app.expo.android.versionCode || 1;
          const next = current + 1;
          app.expo.android.versionCode = next;
          fs.writeFileSync(path, JSON.stringify(app, null, 2) + '\n');
          console.log('android.versionCode bumped: ' + current + ' -> ' + next);
          "

      - name: Install EAS CLI
        run: npm install -g eas-cli

      - name: Decode keystore
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 --decode > artifacts/mobile/android-keystore.jks

      - name: Create credentials.json
        run: |
          cat > artifacts/mobile/credentials.json << 'EOF'
          {
            "android": {
              "keystore": {
                "keystorePath": "./android-keystore.jks",
                "keystorePassword": "${{ secrets.ANDROID_KEYSTORE_PASSWORD }}",
                "keyAlias": "${{ secrets.ANDROID_KEY_ALIAS }}",
                "keyPassword": "${{ secrets.ANDROID_KEY_PASSWORD }}"
              }
            }
          }
          EOF

      - name: Build Android (local)
        working-directory: artifacts/mobile
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          ANDROID_HOME: /usr/local/lib/android/sdk
        run: eas build --platform android --profile production --local --non-interactive --output build.aab

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: quickprop-agent-android
          path: artifacts/mobile/build.aab
          retention-days: 7