name: Build Android AAB

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile --shamefully-hoist

      - name: Bump versionCode in app.json
        run: |
          node -e "
          const fs = require('fs');
          const path = 'artifacts/mobile/app.json';
          const app = JSON.parse(fs.readFileSync(path, 'utf8'));
          const current = app.expo.android.versionCode || 1;
          const next = current + 1;
          app.expo.android.versionCode = next;
          fs.writeFileSync(path, JSON.stringify(app, null, 2) + '\n');
          console.log('android.versionCode bumped: ' + current + ' -> ' + next);
          "

      - name: Install runtime deps pnpm missed into mobile node_modules
        run: |
          TMPDIR=$(mktemp -d)
          echo '{}' > "$TMPDIR/package.json"
          npm install --prefix "$TMPDIR" --no-save --no-package-lock --legacy-peer-deps \
            expo-secure-store@15.0.8 \
            expo-local-authentication@17.0.8 \
            expo-apple-authentication@8.0.8
          mkdir -p artifacts/mobile/node_modules
          cp -r "$TMPDIR/node_modules/expo-secure-store"        artifacts/mobile/node_modules/
          cp -r "$TMPDIR/node_modules/expo-local-authentication" artifacts/mobile/node_modules/
          cp -r "$TMPDIR/node_modules/expo-apple-authentication" artifacts/mobile/node_modules/

      - name: Link mobile dependencies into artifacts/mobile/node_modules
        run: node .github/scripts/link-mobile-deps.js

      - name: Expo prebuild (Android)
        working-directory: artifacts/mobile
        run: npx expo prebuild --platform android --no-install

      - name: Create expo-secure-store res/xml files (library resources missing from cp install)
        run: |
          mkdir -p artifacts/mobile/android/app/src/main/res/xml
          cat > artifacts/mobile/android/app/src/main/res/xml/secure_store_backup_rules.xml << 'XMLEOF'
          <?xml version="1.0" encoding="utf-8"?>
          <full-backup-content>
            <include domain="sharedpref" path="."/>
            <exclude domain="sharedpref" path="SecureStore"/>
          </full-backup-content>
          XMLEOF
          cat > artifacts/mobile/android/app/src/main/res/xml/secure_store_data_extraction_rules.xml << 'XMLEOF'
          <?xml version="1.0" encoding="utf-8"?>
          <data-extraction-rules>
            <cloud-backup>
              <include domain="sharedpref" path="."/>
              <exclude domain="sharedpref" path="SecureStore"/>
            </cloud-backup>
            <device-transfer>
              <include domain="sharedpref" path="."/>
              <exclude domain="sharedpref" path="SecureStore"/>
            </device-transfer>
          </data-extraction-rules>
          XMLEOF

      - name: Decode keystore
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 --decode > artifacts/mobile/android-keystore.jks

      - name: Build Android AAB with Gradle
        working-directory: artifacts/mobile/android
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
        run: |
          chmod +x gradlew
          ./gradlew bundleRelease \
            -Pandroid.injected.signing.store.file="$(pwd)/../android-keystore.jks" \
            -Pandroid.injected.signing.store.password="${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" \
            -Pandroid.injected.signing.key.alias="${{ secrets.ANDROID_KEY_ALIAS }}" \
            -Pandroid.injected.signing.key.password="${{ secrets.ANDROID_KEY_PASSWORD }}"

      - name: Locate AAB
        id: aab
        run: |
          AAB=$(find artifacts/mobile/android -name "*.aab" | head -1)
          echo "path=$AAB" >> $GITHUB_OUTPUT
          echo "Found AAB: $AAB"

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: quickprop-agent-android
          path: ${{ steps.aab.outputs.path }}
          retention-days: 7

      - name: Build debug APK for Test Lab
        run: |
          cd artifacts/mobile/android
          export ANDROID_HOME=/usr/local/lib/android/sdk
          ./gradlew assembleDebug

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: quickprop-agent-debug
          path: artifacts/mobile/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7

      - name: Authenticate to Google Cloud (WIF)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}

      - name: Set up gcloud CLI
        uses: google-github-actions/setup-gcloud@v2

      - name: Stage APK in project GCS bucket
        run: |
          APK=$(find artifacts/mobile/android -name "app-debug.apk" | head -1)
          BUCKET="gs://quickprop-c365c-ci-artifacts"
          gcloud storage buckets create "$BUCKET" \
            --project quickprop-c365c \
            --location us-central1 \
            --uniform-bucket-level-access 2>/dev/null || true
          gcloud storage cp "$APK" "$BUCKET/app-debug.apk"
          echo "APK_GCS_URI=$BUCKET/app-debug.apk" >> "$GITHUB_ENV"
          echo "Staged to: $BUCKET/app-debug.apk"

      - name: Run Firebase Test Lab (Robo)
        run: |
          echo "Running Robo test on: $APK_GCS_URI"
          gcloud firebase test android run \
            --project quickprop-c365c \
            --type robo \
            --app "$APK_GCS_URI" \
            --device model=oriole,version=31,locale=en,orientation=portrait \
            --timeout 90s