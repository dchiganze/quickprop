name: Check Certificate Type
on:
  workflow_dispatch:
jobs:
  check:
    runs-on: macos-latest
    steps:
      - name: Import certificate and check type
        env:
          IOS_DIST_CERT_BASE64: ${{ secrets.IOS_DIST_CERT_BASE64 }}
          IOS_DIST_CERT_PASSWORD: ${{ secrets.IOS_DIST_CERT_PASSWORD }}
        run: |
          KEYCHAIN_PASS=$(openssl rand -base64 32)
          security create-keychain -p "$KEYCHAIN_PASS" check.keychain
          security default-keychain -s check.keychain
          security unlock-keychain -p "$KEYCHAIN_PASS" check.keychain
          echo "$IOS_DIST_CERT_BASE64" | openssl base64 -d -A -out /tmp/cert.p12
          echo "=== All identities in .p12 ==="
          openssl pkcs12 \
            -in /tmp/cert.p12 \
            -passin "pass:$IOS_DIST_CERT_PASSWORD" \
            -nokeys 2>/dev/null \
            | openssl x509 -noout -subject -issuer
          security import /tmp/cert.p12 \
            -k check.keychain \
            -P "$IOS_DIST_CERT_PASSWORD" \
            -A -T /usr/bin/codesign 2>/dev/null || true
          echo "=== Identities available for codesigning ==="
          security find-identity -v -p codesigning check.keychain
