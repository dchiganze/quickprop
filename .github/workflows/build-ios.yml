name: Build iOS IPA
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9
      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile
      - name: Import distribution certificate into keychain
        env:
          IOS_DIST_CERT_BASE64: ${{ secrets.IOS_DIST_CERT_BASE64 }}
          IOS_DIST_CERT_PASSWORD: ${{ secrets.IOS_DIST_CERT_PASSWORD }}
        run: |
          KEYCHAIN_PASS=$(openssl rand -base64 32)
          security create-keychain -p "$KEYCHAIN_PASS" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "$KEYCHAIN_PASS" build.keychain
          security set-keychain-settings -t 3600 -u build.keychain
          echo "$IOS_DIST_CERT_BASE64" | openssl base64 -d -A -out /tmp/dist-orig.p12
          openssl pkcs12 \
            -in /tmp/dist-orig.p12 \
            -passin "pass:$IOS_DIST_CERT_PASSWORD" \
            -clcerts -nokeys \
            -out /tmp/dist-cert.pem
          openssl pkcs12 \
            -in /tmp/dist-orig.p12 \
            -passin "pass:$IOS_DIST_CERT_PASSWORD" \
            -nocerts -nodes \
            -out /tmp/dist-key.pem
          rm /tmp/dist-orig.p12
          security import /tmp/dist-cert.pem \
            -k build.keychain \
            -A \
            -T /usr/bin/codesign \
            -T /usr/bin/xcodebuild
          security import /tmp/dist-key.pem \
            -k build.keychain \
            -A \
            -T /usr/bin/codesign \
            -T /usr/bin/xcodebuild
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s -t private \
            -k "$KEYCHAIN_PASS" build.keychain || true
          rm /tmp/dist-cert.pem /tmp/dist-key.pem
      - name: Install provisioning profile
        env:
          IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
        run: |
          echo "$IOS_PROVISIONING_PROFILE_BASE64" | openssl base64 -d -A -out /tmp/profile.mobileprovision
          UUID=$(security cms -D -i /tmp/profile.mobileprovision | plutil -extract UUID raw -)
          echo "PROFILE_UUID=${UUID}" >> $GITHUB_ENV
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          cp /tmp/profile.mobileprovision \
            ~/Library/MobileDevice/Provisioning\ Profiles/${UUID}.mobileprovision
          rm /tmp/profile.mobileprovision
          echo "Installed profile: ${UUID}"
      - name: Expo prebuild (generates ios/ with our plugins applied)
        working-directory: artifacts/mobile
        run: npx expo prebuild --platform ios --no-install
      - name: Verify withNoHermes + fmt injection in Podfile
        working-directory: artifacts/mobile
        run: |
          echo "=== Relevant Podfile lines ==="
          grep -n "hermes_enabled\|FMT_USE\|format\.cc\|post_install\|withNoHermes" ios/Podfile \
            || echo "(nothing matched)"
      - name: Pod install
        working-directory: artifacts/mobile/ios
        run: pod install
      - name: Patch fmt for Xcode 26 (consteval -> constexpr)
        shell: python3 {0}
        run: |
          import os, sys
          fmt_dir = 'artifacts/mobile/ios/Pods/fmt'
          if not os.path.isdir(fmt_dir):
              print('ERROR: ' + fmt_dir + ' not found', file=sys.stderr)
              sys.exit(1)
          patched = []
          for root, _, files in os.walk(fmt_dir):
              for fname in files:
                  if not fname.endswith(('.h', '.cc')):
                      continue
                  fpath = os.path.join(root, fname)
                  content = open(fpath, errors='replace').read()
                  if 'consteval' in content:
                      open(fpath, 'w').write(content.replace('consteval', 'constexpr'))
                      patched.append(fpath)
                      print('  patched: ' + fpath)
          print('Done -- ' + str(len(patched)) + ' file(s) patched.')
          if not patched:
              print('WARNING: no occurrences of consteval found.')
              sys.exit(1)
      - name: Detect Xcode workspace and scheme
        working-directory: artifacts/mobile/ios
        run: |
          WORKSPACE=$(ls -d *.xcworkspace 2>/dev/null | head -1)
          echo "XCODE_WORKSPACE=${WORKSPACE}" >> $GITHUB_ENV
          echo "Found workspace: ${WORKSPACE}"
          SCHEME="${WORKSPACE%.xcworkspace}"
          echo "XCODE_SCHEME=${SCHEME}" >> $GITHUB_ENV
          echo "Found scheme: ${SCHEME}"
      - name: Archive
        working-directory: artifacts/mobile/ios
        run: |
          xcodebuild archive \
            -workspace "$XCODE_WORKSPACE" \
            -scheme "$XCODE_SCHEME" \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath "$RUNNER_TEMP/QuickPropAgent.xcarchive" \
            CODE_SIGN_STYLE=Manual \
            PROVISIONING_PROFILE="$PROFILE_UUID" \
            CODE_SIGN_IDENTITY="iPhone Distribution" \
            DEVELOPMENT_TEAM=R7FGJAAUQF
          echo "Archive created:"
          ls -la "$RUNNER_TEMP/QuickPropAgent.xcarchive"
      - name: Write export options plist
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" << 'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>method</key>
              <string>app-store</string>
              <key>teamID</key>
              <string>R7FGJAAUQF</string>
              <key>signingStyle</key>
              <string>manual</string>
              <key>provisioningProfiles</key>
              <dict>
                  <key>com.quickprop.agent</key>
                  <string>PROFILE_UUID_PLACEHOLDER</string>
              </dict>
          </dict>
          </plist>
          EOF
          sed -i '' "s/PROFILE_UUID_PLACEHOLDER/$PROFILE_UUID/" "$RUNNER_TEMP/ExportOptions.plist"
      - name: Export IPA
        run: |
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/QuickPropAgent.xcarchive" \
            -exportPath "$RUNNER_TEMP/ipa" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist"
          echo "IPA contents:"
          ls -la "$RUNNER_TEMP/ipa/"
      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: quickprop-agent-ios
          path: ${{ runner.temp }}/ipa/*.ipa
          retention-days: 7
